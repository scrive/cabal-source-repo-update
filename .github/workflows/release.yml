name: Release

on:
  push:
    tags:
      - v[0-9]*
  workflow_dispatch:

jobs:
  release:
    runs-on: aws-large-ubuntu-latest
    steps:

      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: scrive
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - uses: actions/checkout@v7

      - run: |
          nix build .#static
          cp ./result/bin/cabal-source-repo-update cabal-source-repo-update-${{ runner.arch }}-${{ runner.os }}

      - uses: actions/upload-artifact@v7
        with:
          name: cabal-source-repo-update-${{ runner.arch }}-${{ runner.os }}
          path: cabal-source-repo-update-${{ runner.arch }}-${{ runner.os }}

      - if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          gh release create ${{ github.ref_name }} cabal-source-repo-update-${{ runner.arch }}-${{ runner.os }}
